# terminal opacity and blur
# background_opacity 0.80 
# background_blur 5

# prompt before closing
# confirm_os_window_close 0

# advance 
term xterm-kitty

# terminal bell
enable_audio_bell no

# os specific tweaks (Gnome window decoration for wayland)
linux_display_server x11

# font
font_family        JetBrainsMono NFM ExtraBold
# font_family        DepartureMono Nerd Font
# font_family        BigBlueTerm437 Nerd Font Mono
# font_family        BigBlueTermPlus Nerd Font 
# font_family        FiraCode Nerd Font Mono 
# font_family        Monocraft Bold
# bold_font          Monocraft Bold
# italic_font        Monocraft Bold
# bold_italic_font   Monocraft Bold
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 16.0

modify_font cell_height 110%
adjust_line_height 100%

# font size management 
map ctrl+shift+backspace change_font_size all 0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size  no
initial_window_width  1200
initial_window_height 750
window_border_width 1.5pt
enabled_layouts tall
window_padding_width 2
window_margin_width 2
hide_window_decorations no

# window management 
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# layout management
map ctrl+shift+l next_layout
map ctrl+alt+r goto_layout tall
map ctrl+alt+s goto_layout stack

# tab bar customization
# tab_bar_style powerline
# tab_powerline_style angled
tab_bar_edge top
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_style         custom
tab_separator         ""
tab_title_template " {index}: {f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 13 else title} "

# tab management
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

clipboard_control write-clipboard write-primary
allow_remote_control yes
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+insert paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down

# BEGIN_KITTY_THEME
# Dark One Nuanced
include current-theme.conf
# END_KITTY_THEME


