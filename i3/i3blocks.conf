# Global properties
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=20
markup=pango
color=#b4befe

# [window]
# command=~/.config/i3/focused_window.sh
# interval=1
# min_width=200

# [mediaplayer]
# command=/home/mohannad/config/i3/marquee.sh 20 0.2 "playerctl metadata --format '{{ title }}'"`
# interval=5

[time]
label=󱑊 
command=date '+%I:%M %p'
min_width=400
interval=1


[date]
label=󰃭 
command=date '+%a %b %d'
interval=3600

[vitals]
label=
command=~/.config/i3/vitals
interval=10

[battery]
# label=󰁹 
command=~/.config/i3/battery
interval=10

[power]
command=~/.config/i3/power-profile
interval=5
signal=10
click-left=notify-send "i3blocks" "Click works"
# click-left=~/.local/bin/rofi-power-profile

[language]
label=󰌌 
command=~/.config/i3/lang
interval=1

[brightness]
label= 
command=$HOME/.config/i3/brightness
interval=once
signal=10

[volume]
label= 
command=$HOME/.config/i3/volume
interval=once
signal=10

[mic]
command=$HOME/.config/i3/mic
interval=1
signal=10

